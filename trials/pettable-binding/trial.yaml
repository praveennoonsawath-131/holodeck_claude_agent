name: PetTable datatable binding
platform_type: WEB
preview_page_name: PetTable
validators:
  - name: PetTable page loads
    type: PLAYWRIGHT_PYTHON
    description: The PetTable page opens without console or HTTP errors
    page_name: PetTable
    checks:
      - check: PAGE_LOADS
  - name: Pet table has data
    type: PLAYWRIGHT_PYTHON
    description: The table on the PetTable page is visible, has its columns and shows at least one pet row
    page_name: PetTable
    timeout_seconds: 90
    checks:
      - check: DATA_TABLE_LOADS
        expected_columns: [Id, Name, Status]
        minimum_rows: 1
