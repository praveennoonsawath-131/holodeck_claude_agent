name: PetTable datatable binding
platform_type: WEB
preview_page_name: PetTable
validators:
  - name: Pet table is visible
    type: PLAYWRIGHT_PYTHON
    description: The PetTable page renders a data table
    test_file: validators/test_pettable.py
    tests: [test_table_is_visible]
    page_name: PetTable
    timeout_seconds: 90
  - name: Pet table shows rows
    type: PLAYWRIGHT_PYTHON
    description: The table has at least one pet row, not "No data found"
    test_file: validators/test_pettable.py
    tests: [test_table_shows_pet_rows]
    page_name: PetTable
    timeout_seconds: 90
  - name: Table is bound to findPetsByTags
    type: PLAYWRIGHT_PYTHON
    description: The page calls the petstore findPetsByTags API and the call succeeds
    test_file: validators/test_pettable.py
    tests: [test_table_calls_petstore_find_by_tags]
    page_name: PetTable
    timeout_seconds: 90
